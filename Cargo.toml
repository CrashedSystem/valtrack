[package]
name = "valtrack"
version = "0.1.3"
edition = "2021"
description = "Minimal Valorant live-match tracker without Overwolf"
license = "GPL-3.0-only"

[[bin]]
name = "valtrack"
path = "src/main.rs"

# The installer is a separate program: the app stays a single small exe with no
# UI toolkit, and setup is only needed once.
[[bin]]
name = "valtrack-setup"
path = "src/bin/setup.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
native-tls = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
